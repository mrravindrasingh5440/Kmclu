<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>HTML Character Entities</title>
</head>
<body>
<h1>Special Characters in HTML</h1>
<p>Less than: &lt;</p>
<p>Greater than: &gt;</p>
<p>Ampersand: &amp;</p>
<p>Copyright: &copy; 2026</p>
<p>Registered symbol: &reg;</p>
<p>Trademark: &trade;</p>
<p>Quotation marks: &quot;Web Design&quot;</p>
<p>Single quote: &apos;HTML&apos;</p>
<p>Non-breaking space: BCA&nbsp;304</p>
<p>Mathematics:</p>
<p>x &le; y</p>
<p>y &ge; x</p>
<p>5 &times; 4 = 20</p>
<p>10 &divide; 2 = 5</p>
<p>Approximation: &asymp;</p>
</body>
</html>
